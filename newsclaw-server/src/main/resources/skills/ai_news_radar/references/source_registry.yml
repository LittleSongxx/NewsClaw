version: 2
scope: global-and-china
policy:
  official_first: true
  media_requires_corroboration: true
  minimum_official_sources_for_verified: 1
  minimum_independent_sources_without_official: 2
  conflict_status: conflicted
official:
  models_and_research:
    - name: OpenAI News
      source_key: openai
      domains: [openai.com]
      query_sites: ["openai.com/index"]
    - name: Anthropic News
      source_key: anthropic
      domains: [anthropic.com]
      query_sites: ["anthropic.com/news"]
    - name: Mistral AI
      source_key: mistral
      domains: [mistral.ai]
      query_sites: ["mistral.ai/news", "mistral.ai"]
    - name: DeepSeek
      source_key: deepseek
      domains: [deepseek.com]
      url_prefixes: ["https://github.com/deepseek-ai/"]
      query_sites: ["deepseek.com", "github.com/deepseek-ai"]
    - name: Google DeepMind
      source_key: google-deepmind
      domains: [deepmind.google, blog.google]
      query_sites: ["deepmind.google/discover", "blog.google/technology/ai"]
    - name: Meta AI
      source_key: meta-ai
      domains: [ai.meta.com, about.fb.com]
      query_sites: ["ai.meta.com", "about.fb.com/news"]
    - name: Qwen / Alibaba
      source_key: alibaba-qwen
      domains: [qwenlm.github.io, alibabagroup.com]
      url_prefixes: ["https://github.com/QwenLM/"]
      query_sites: ["qwenlm.github.io", "github.com/QwenLM"]
    - name: Zhipu AI
      source_key: zhipu
      domains: [zhipuai.cn, bigmodel.cn]
      query_sites: ["zhipuai.cn", "bigmodel.cn"]
    - name: Hugging Face
      source_key: huggingface
      domains: [huggingface.co]
      domain_match: prefix_only
      url_prefixes: ["https://huggingface.co/blog/", "https://huggingface.co/huggingface/"]
      query_sites: ["huggingface.co/blog", "huggingface.co/huggingface"]
    - name: Z.ai
      source_key: z-ai
      domains: [z.ai]
      query_sites: ["z.ai/blog", "z.ai"]
    - name: Deep Cogito
      source_key: deep-cogito
      domains: [deepcogito.com]
      query_sites: ["deepcogito.com"]
  global_products:
    - name: Google Cloud and AI
      source_key: google
      domains: [cloud.google.com]
      query_sites: ["cloud.google.com/blog/products/ai-machine-learning", "blog.google/technology/ai"]
    - name: Salesforce
      source_key: salesforce
      domains: [salesforce.com]
      query_sites: ["salesforce.com/news", "salesforce.com/claudeforce"]
    - name: Qualcomm
      source_key: qualcomm
      domains: [qualcomm.com]
      query_sites: ["qualcomm.com/developer/blog", "qualcomm.com/news"]
    - name: Amazon Web Services
      source_key: aws
      domains: [aws.amazon.com]
      query_sites: ["aws.amazon.com/blogs/machine-learning", "aws.amazon.com/about-aws/whats-new"]
    - name: LF AI & Data Foundation
      source_key: lf-ai-data
      domains: [lfaidata.foundation]
      query_sites: ["lfaidata.foundation/blog"]
    - name: Particle Pro / Radar
      source_key: particle
      domains: [particle.pro]
      query_sites: ["particle.pro", "radar.particle.pro"]
  china_products:
    - name: ByteDance Seed / Volcano Engine
      source_key: bytedance
      domains: [seed.bytedance.com, volcengine.com]
      query_sites: ["seed.bytedance.com", "volcengine.com/product"]
    - name: Baidu AI
      source_key: baidu
      # baidu.com hosts search, user/community and developer-content surfaces.
      # Search only reviewed first-party subdomains and grant official status
      # only to the listed editorial/product-announcement paths.
      domains: [baidu.com]
      query_domains: [www.baidu.com, yiyan.baidu.com, ai.baidu.com, ir.baidu.com]
      domain_match: prefix_only
      url_prefixes:
        - "https://www.baidu.com/ai/"
        - "https://yiyan.baidu.com/blog/"
        - "https://ai.baidu.com/support/news"
        - "https://ir.baidu.com/news-releases/"
      query_sites: ["yiyan.baidu.com/blog", "ai.baidu.com/support/news", "ir.baidu.com/news-releases"]
    - name: Tencent Hunyuan
      source_key: tencent
      domains: [hunyuan.tencent.com]
      query_sites: ["hunyuan.tencent.com"]
    - name: Tencent Newsroom
      source_key: tencent
      domains: [tencent.com]
      query_domains: [www.tencent.com]
      domain_match: prefix_only
      url_prefixes:
        - "https://www.tencent.com/zh-cn/"
        - "https://www.tencent.com/zh-hk/"
        - "https://www.tencent.com/en-us/"
      query_sites: ["www.tencent.com/zh-cn/newsroom"]
    - name: Huawei Ascend / Pangu
      source_key: huawei
      domains: [huawei.com, hiascend.com]
      query_sites: ["huawei.com/cn", "hiascend.com"]
    - name: Xiaomi AI
      source_key: xiaomi
      domains: [xiaomi.com]
      query_sites: ["xiaomi.com"]
  robotics:
    - name: Unitree
      source_key: unitree
      domains: [unitree.com]
      query_sites: ["unitree.com"]
    - name: UBTECH
      source_key: ubtech
      domains: [ubtrobot.com]
      query_sites: ["ubtrobot.com"]
    - name: AgiBot
      source_key: agibot
      domains: [agibot.com]
      query_sites: ["agibot.com"]
    - name: Fourier Intelligence
      source_key: fourier
      domains: [fftai.com]
      query_sites: ["fftai.com"]
    - name: Figure
      source_key: figure
      domains: [figure.ai]
      query_sites: ["figure.ai"]
    - name: Boston Dynamics
      source_key: boston-dynamics
      domains: [bostondynamics.com]
      query_sites: ["bostondynamics.com"]
    - name: Tesla Optimus
      source_key: tesla
      domains: [tesla.com]
      query_sites: ["tesla.com/AI", "tesla.com/blog"]
    - name: NVIDIA Robotics
      source_key: nvidia
      domains: [developer.nvidia.com, nvidia.com]
      query_sites: ["developer.nvidia.com/robotics"]
  infrastructure:
    - name: NVIDIA
      source_key: nvidia
      domains: [nvidia.com]
      query_sites: ["nvidia.com/news"]
    - name: AMD
      source_key: amd
      domains: [amd.com]
      query_sites: ["amd.com/en/newsroom"]
    - name: Ascend
      source_key: huawei
      domains: [hiascend.com]
      query_sites: ["hiascend.com"]
    - name: Cambricon
      source_key: cambricon
      domains: [cambricon.com]
      query_sites: ["cambricon.com"]
