<!doctype html>
<!--
  AI-tech editorial QUOTE / key-judgement card. Vertical 3:4 (1080x1440).
  Replace {{QUOTE}}, {{SOURCE}}, {{TAG}}, {{FOOTER}}.
  Use <em>...</em> once for the most important evidence-backed phrase.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
    background: #111a21; color: #f6f8f8;
    display: flex; flex-direction: column; justify-content: center;
    padding: 92px 82px; position: relative; overflow: hidden;
  }
  .rail { position: absolute; top: 0; left: 0; bottom: 0; width: 18px; background: #00a68a; }
  .tag {
    align-self: flex-start; padding: 12px 18px;
    color: #9fe8da; border: 2px solid #3a575f;
    font-size: 25px; font-weight: 800;
  }
  .label { margin-top: 72px; color: #ff8a80; font-size: 28px; font-weight: 850; }
  .quote {
    margin-top: 32px; padding-left: 36px; border-left: 8px solid #2878d0;
    font-size: 67px; font-weight: 800; line-height: 1.42; overflow-wrap: anywhere;
  }
  .quote em { color: #9fe8da; font-style: normal; }
  .source { margin-top: 58px; color: #bac7ca; font-size: 31px; font-weight: 600; line-height: 1.5; }
  .footer {
    position: absolute; left: 82px; right: 82px; bottom: 72px;
    display: flex; justify-content: space-between; padding-top: 22px;
    border-top: 2px solid #3a4a50; color: #8ea0a5; font-size: 24px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="rail"></div>
  <div class="tag">{{TAG}}</div>
  <div class="label">KEY JUDGEMENT</div>
  <p class="quote">{{QUOTE}}</p>
  <p class="source">{{SOURCE}}</p>
  <footer class="footer"><span>{{FOOTER}}</span><span>AI SIGNAL</span></footer>
</body>
</html>
