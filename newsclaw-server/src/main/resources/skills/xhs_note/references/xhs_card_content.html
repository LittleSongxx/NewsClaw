<!doctype html>
<!--
  AI-tech editorial CONTENT card. Vertical 3:4 (1080x1440).
  Replace {{TITLE}}, {{SUBTITLE}}, and {{POINTS}}. Keep 3-5 concise <li> items.
  Wrap only evidence-backed keywords in <strong>...</strong>.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
    background: #f7f8f8; color: #101820;
    padding: 72px 76px 148px; display: flex; flex-direction: column; position: relative;
    overflow: hidden;
  }
  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 24px; border-bottom: 3px solid #101820;
    font-size: 25px; font-weight: 850;
  }
  .masthead span:last-child { color: #007d69; }
  .accent { width: 92px; height: 12px; margin-top: 48px; background: #00a68a; }
  .title { margin-top: 26px; font-size: 68px; font-weight: 900; line-height: 1.24; overflow-wrap: break-word; word-break: normal; }
  .subtitle { margin-top: 20px; color: #52676e; font-size: 31px; font-weight: 600; line-height: 1.5; }
  ul { list-style: none; counter-reset: item; margin-top: 42px; min-height: 0; }
  li {
    counter-increment: item; display: block; position: relative; min-width: 0;
    margin-bottom: 16px; padding: 27px 28px 27px 116px;
    background: #ffffff; border: 2px solid #d8dfe1; border-left: 8px solid #2878d0;
    font-size: 33px; line-height: 1.46; font-weight: 550; overflow-wrap: break-word; word-break: normal;
  }
  li:nth-child(even) { border-left-color: #ff6b5e; }
  li::before {
    content: counter(item, decimal-leading-zero);
    position: absolute; top: 27px; left: 28px; display: grid; place-items: center; width: 64px; height: 58px;
    background: #e7f5f2; color: #007d69; font-size: 25px; font-weight: 900;
  }
  li strong { color: #075ca9; font-weight: 900; overflow-wrap: anywhere; word-break: normal; }
  .footer {
    position: absolute; left: 76px; right: 76px; bottom: 56px;
    display: flex; justify-content: space-between; padding-top: 18px;
    border-top: 2px solid #b9c4c7; color: #60747a; font-size: 23px; font-weight: 700;
  }
</style>
</head>
<body>
  <header class="masthead"><span>AI SIGNAL / EVIDENCE</span><span>FACTS FIRST</span></header>
  <div class="accent"></div>
  <h1 class="title">{{TITLE}}</h1>
  <p class="subtitle">{{SUBTITLE}}</p>
  <ul>
    {{POINTS}}
  </ul>
  <footer class="footer"><span>事实 / 影响 / 边界</span><span>AI NEWS OPS</span></footer>
</body>
</html>
