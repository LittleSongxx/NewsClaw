server:
  port: 18088
  shutdown: graceful
  servlet:
    context-path: /

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: newsclaw-server
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev

  # 数据源（默认 H2，生产切换为 mysql 或 kingbase profile）
  datasource:
    url: jdbc:h2:file:./data/newsclaw;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # Issue #50: explicit Hikari sizing. Default of 10 was being exhausted
    # by O(100) cron jobs firing on minute boundaries (each run holds 3-4
    # connections sequentially) plus ChannelHealthMonitor's per-minute scan.
    # 30 leaves headroom for HTTP / SSE / channel adapters even with the
    # cron concurrency limiter (CronJobService.MAX_CONCURRENT_CRON_RUNS=8)
    # at full saturation.
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # SQL 初始化由 DatabaseBootstrapRunner 接管，关闭 Spring 自动执行
  sql:
    init:
      mode: never

  # Flyway 数据库版本迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    locations:
      - classpath:db/migration/h2
    validate-on-migrate: true
    clean-disabled: true
    # Disable Flyway's built-in ${...} placeholder substitution. Some migrations
    # (e.g. V85 ckjia MCP seed) intentionally store ${ENV_VAR} literals so that
    # newsclaw's runtime header parser (McpClientManager.parseHeaders) can
    # expand them at request time. Flyway would otherwise try to resolve those
    # tokens at migration time and fail with "No value provided for placeholder".
    # Safe to disable globally because no migration in this project relies on
    # Flyway-side ${...} substitution.
    placeholder-replacement: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  # Spring AI Alibaba (DashScope) — Spring AI Alibaba 1.1.x configuration path.
  #
  # The api-key here is only consumed by Spring AI Alibaba's auto-configured beans
  # as a *fallback*. The real source of truth for every provider/key/model is the
  # admin UI ("Settings → Models", persisted in mate_model_provider /
  # mate_model_config); AgentDashScopeChatModelBuilder resolves the key per-request
  # from the provider row first, only falling back to this property when the row
  # is incomplete. The placeholder default keeps DashScopeChatAutoConfiguration
  # happy at startup when no env var is set (Docker / fresh install) — leave it
  # alone unless you know what you're doing.
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:configure-in-admin-ui}
      chat:
        options:
          model: qwen-max
          temperature: 0.7
          max-tokens: 4096
    # Spring AI 1.1.x 会话记忆配置（使用内嵌 H2 时无需额外配置）
    chat:
      observations:
        log-prompt: false
        log-completion: false
      memory:
        repository:
          jdbc:
            initialize-schema: embedded
    # Spring AI Retry 配置：429/503/529 归为可重试（TransientAiException），启用指数退避
    # RFC-012 M1：max-attempts 从 5 调到 2，避免与 wiki 层 callLlmWithResilientRetry 的 5×N 嵌套放大；
    # 真正的重试主控权交给业务层（wiki / agent），Spring AI 仅负责"一次性瞬时抖动"的快速重试
    retry:
      max-attempts: 2
      on-http-codes: 429, 503, 529
      backoff:
        initial-interval: 3000
        multiplier: 3
        max-interval: 60000
    # 禁用 Spring AI MCP Client 自动配置（由 McpClientManager 自行管理生命周期）
    mcp:
      client:
        enabled: false

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL parameter values can contain prompts/model thinking. Keep them out of
    # logs by default; operators may explicitly opt in for short-lived diagnosis.
    log-impl: ${NEWSCLAW_MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

# SpringDoc OpenAPI
# 注意：/swagger-ui*、/v3/api-docs*、/webjars/** 落在 SecurityConfig 的
# .anyRequest().permitAll()，即 Swagger UI 当前公开可访问。如生产需要收口，
# 在 SecurityConfig 加显式规则（不要在此处配）。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # 把单个嵌套 query 参数对象（如分页 wrapper）拍平成独立字段，减少 schema 噪音
  default-flat-param-object: true

# Micrometer is the in-process metrics API. When explicitly enabled, Spring
# Boot's managed OTLP registry exports it to an OpenTelemetry collector.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace
  otlp:
    metrics:
      export:
        enabled: ${NEWSCLAW_OTLP_METRICS_ENABLED:false}
        url: ${NEWSCLAW_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: ${NEWSCLAW_OTLP_METRICS_STEP:60s}
        connect-timeout: ${NEWSCLAW_OTLP_METRICS_CONNECT_TIMEOUT:3s}
        read-timeout: ${NEWSCLAW_OTLP_METRICS_READ_TIMEOUT:10s}

# NewsClaw 自定义配置
newsclaw:
  flyway:
    # Never rewrite migration checksums or failed history rows implicitly.
    # Set NEWSCLAW_FLYWAY_AUTO_REPAIR=true only for a reviewed, one-off
    # recovery, then disable it again before returning to normal operation.
    auto-repair: ${NEWSCLAW_FLYWAY_AUTO_REPAIR:false}
  a2a:
    enabled: ${NEWSCLAW_A2A_ENABLED:false}
    # Public base URL for Agent Cards. Production deployments should set this
    # explicitly so peers do not depend on proxy-derived request headers.
    base-url: ${NEWSCLAW_A2A_BASE_URL:}
    call-timeout-ms: ${NEWSCLAW_A2A_CALL_TIMEOUT_MS:120000}
    max-tasks: ${NEWSCLAW_A2A_MAX_TASKS:1000}
    task-ttl-seconds: ${NEWSCLAW_A2A_TASK_TTL_SECONDS:3600}
    max-response-bytes: ${NEWSCLAW_A2A_MAX_RESPONSE_BYTES:1048576}
    outbound-timeout-ms: ${NEWSCLAW_A2A_OUTBOUND_TIMEOUT_MS:120000}
    allow-private-outbound: ${NEWSCLAW_A2A_ALLOW_PRIVATE_OUTBOUND:false}
    sweep-interval-ms: ${NEWSCLAW_A2A_SWEEP_INTERVAL_MS:60000}

  webchat:
    public-enabled: ${NEWSCLAW_WEBCHAT_PUBLIC_ENABLED:true}
    max-concurrent-streams-per-key: ${NEWSCLAW_WEBCHAT_MAX_CONCURRENT_STREAMS_PER_KEY:4}
    requests-per-minute-per-key: ${NEWSCLAW_WEBCHAT_REQUESTS_PER_MINUTE_PER_KEY:30}
    max-message-chars: ${NEWSCLAW_WEBCHAT_MAX_MESSAGE_CHARS:16000}

  workflow:
    recovery:
      # A v0 workflow cannot safely resume an arbitrary in-flight provider
      # call after a JVM crash. Reconcile only very old rows, and fence the
      # update so a live worker wins a race with the sweeper.
      stale-after-minutes: ${NEWSCLAW_WORKFLOW_RECOVERY_STALE_AFTER_MINUTES:1440}
      interval-ms: ${NEWSCLAW_WORKFLOW_RECOVERY_INTERVAL_MS:300000}
      initial-delay-ms: ${NEWSCLAW_WORKFLOW_RECOVERY_INITIAL_DELAY_MS:120000}

  ai-news:
    # Production delivery tools must carry a server-owned event context.
    require-event-context: ${NEWSCLAW_AI_NEWS_REQUIRE_EVENT_CONTEXT:false}
    strict-evidence-boundary: ${NEWSCLAW_AI_NEWS_STRICT_EVIDENCE_BOUNDARY:false}
    # Optional role-aware model overrides. Values use provider/model (or a
    # model id when the provider is unambiguous); blank values use the
    # deterministic enabled-model fallback in AiNewsModelRouter.
    models:
      discovery: ${NEWSCLAW_AI_NEWS_MODEL_DISCOVERY:}
      verification: ${NEWSCLAW_AI_NEWS_MODEL_VERIFICATION:}
      editorial: ${NEWSCLAW_AI_NEWS_MODEL_EDITORIAL:}
      visual: ${NEWSCLAW_AI_NEWS_MODEL_VISUAL:}
      delivery: ${NEWSCLAW_AI_NEWS_MODEL_DELIVERY:}
    # Discovery is precision-gated before source capture. Parseable stale
    # results are rejected; undated rows use bounded exploration quotas so a
    # search index cannot fill Top-K with evergreen or repeatedly updated pages.
    discovery:
      # Optional comma-separated provider ids. When set, each query lane is
      # unioned across all listed providers before deterministic fusion.
      provider-ids: ${NEWSCLAW_AI_NEWS_DISCOVERY_PROVIDER_IDS:}
      max-candidates-per-host: ${NEWSCLAW_AI_NEWS_DISCOVERY_MAX_CANDIDATES_PER_HOST:4}
      max-candidates-per-story: ${NEWSCLAW_AI_NEWS_DISCOVERY_MAX_CANDIDATES_PER_STORY:2}
      current-open-web-percent: ${NEWSCLAW_AI_NEWS_DISCOVERY_CURRENT_OPEN_WEB_PERCENT:20}
      max-unknown-percent: ${NEWSCLAW_AI_NEWS_DISCOVERY_MAX_UNKNOWN_PERCENT:0}
      unknown-official-percent: ${NEWSCLAW_AI_NEWS_DISCOVERY_UNKNOWN_OFFICIAL_PERCENT:20}
      unknown-media-percent: ${NEWSCLAW_AI_NEWS_DISCOVERY_UNKNOWN_MEDIA_PERCENT:20}
      unknown-open-web-percent: ${NEWSCLAW_AI_NEWS_DISCOVERY_UNKNOWN_OPEN_WEB_PERCENT:0}
    sources:
      catalog:
        # Comma/space-separated endpoint ids from the versioned source catalog.
        # Unknown ids fail startup; catalog entries remain disabled by default.
        enabled-endpoint-ids: ${NEWSCLAW_AI_NEWS_SOURCE_ENDPOINT_IDS:}
      rss:
        # Comma-separated, operator-reviewed RSS/Atom endpoints. Feed metadata
        # is fused as an untrusted zero-search-credit discovery lane. Polls use
        # ETag/Last-Modified validators when publishers provide them.
        feeds: ${NEWSCLAW_AI_NEWS_RSS_FEEDS:}
      news-sitemaps:
        # Google News Sitemap or sitemap-index endpoints. Only URL entries with
        # explicit news publication metadata become discovery candidates.
        urls: ${NEWSCLAW_AI_NEWS_SITEMAPS:}
      searxng:
        # Reuses the existing Compose SearXNG endpoint when no news-specific
        # override is provided. Private endpoint access stays explicitly opt-in.
        base-url: ${NEWSCLAW_AI_NEWS_SEARXNG_BASE_URL:${SEARXNG_BASE_URL:}}
        allow-private-endpoint: ${NEWSCLAW_AI_NEWS_SEARXNG_ALLOW_PRIVATE_ENDPOINT:false}
    # Independent, durable polling mainline for structured sources. Discovery
    # reads the latest persisted item versions and does not wait on publishers.
    ingestion:
      enabled: ${NEWSCLAW_AI_NEWS_INGESTION_ENABLED:true}
      scan-interval-ms: ${NEWSCLAW_AI_NEWS_INGESTION_SCAN_INTERVAL_MS:60000}
      initial-delay-ms: ${NEWSCLAW_AI_NEWS_INGESTION_INITIAL_DELAY_MS:15000}
      on-demand-refresh-if-empty: ${NEWSCLAW_AI_NEWS_INGESTION_ON_DEMAND_REFRESH_IF_EMPTY:false}
      max-polls-per-cycle: ${NEWSCLAW_AI_NEWS_INGESTION_MAX_POLLS_PER_CYCLE:50}
      stale-run-minutes: ${NEWSCLAW_AI_NEWS_INGESTION_STALE_RUN_MINUTES:30}
      candidate-lookback-days: ${NEWSCLAW_AI_NEWS_INGESTION_CANDIDATE_LOOKBACK_DAYS:31}
    # V213 shadow mainline. Both the scan and outbound capture switches are
    # default-off so upgrades neither activate sources nor add network traffic.
    candidate-pipeline:
      enabled: ${NEWSCLAW_AI_NEWS_CANDIDATE_PIPELINE_ENABLED:false}
      capture-enabled: ${NEWSCLAW_AI_NEWS_CANDIDATE_CAPTURE_ENABLED:false}
      scan-interval-ms: ${NEWSCLAW_AI_NEWS_CANDIDATE_SCAN_INTERVAL_MS:900000}
      capture-interval-ms: ${NEWSCLAW_AI_NEWS_CANDIDATE_CAPTURE_INTERVAL_MS:60000}
      initial-delay-ms: ${NEWSCLAW_AI_NEWS_CANDIDATE_INITIAL_DELAY_MS:60000}
      default-workspace-id: ${NEWSCLAW_AI_NEWS_CANDIDATE_WORKSPACE_ID:1}
      topic: ${NEWSCLAW_AI_NEWS_CANDIDATE_TOPIC:artificial intelligence}
      lookback-hours: ${NEWSCLAW_AI_NEWS_CANDIDATE_LOOKBACK_HOURS:24}
      max-candidates: ${NEWSCLAW_AI_NEWS_CANDIDATE_MAX_CANDIDATES:30}
      max-captures-per-scan: ${NEWSCLAW_AI_NEWS_CANDIDATE_MAX_CAPTURES_PER_SCAN:10}
      max-capture-attempts: ${NEWSCLAW_AI_NEWS_CANDIDATE_MAX_CAPTURE_ATTEMPTS:3}
      capture-retry-minutes: ${NEWSCLAW_AI_NEWS_CANDIDATE_CAPTURE_RETRY_MINUTES:15}
      stale-capture-minutes: ${NEWSCLAW_AI_NEWS_CANDIDATE_STALE_CAPTURE_MINUTES:30}
      stale-run-minutes: ${NEWSCLAW_AI_NEWS_CANDIDATE_STALE_RUN_MINUTES:120}
      retention-days: ${NEWSCLAW_AI_NEWS_CANDIDATE_RETENTION_DAYS:90}
      capture-retention-days: ${NEWSCLAW_AI_NEWS_CAPTURE_RETENTION_DAYS:30}
      retention-batch-size: ${NEWSCLAW_AI_NEWS_RETENTION_BATCH_SIZE:100}
      retention-cron: ${NEWSCLAW_AI_NEWS_RETENTION_CRON:0 30 3 * * ?}
      config-version: ${NEWSCLAW_AI_NEWS_CANDIDATE_CONFIG_VERSION:candidate-pipeline-v2-bocha}
      china-search:
        enabled: ${NEWSCLAW_AI_NEWS_CHINA_SEARCH_ENABLED:false}
        # Dedicated Bocha secret: deliberately not any existing model/video key.
        api-key: ${NEWSCLAW_AI_NEWS_CHINA_SEARCH_API_KEY:}
        base-url: ${NEWSCLAW_AI_NEWS_CHINA_SEARCH_BASE_URL:https://api.bochaai.com/v1/web-search}
        count: ${NEWSCLAW_AI_NEWS_CHINA_SEARCH_COUNT:20}
        timeout-seconds: ${NEWSCLAW_AI_NEWS_CHINA_SEARCH_TIMEOUT_SECONDS:15}
        queries:
          - 人工智能 模型 产品 智能体 最新发布
          - 人工智能 融资 并购 政策 监管 最新消息
          - 人工智能 芯片 算力 安全 研究 最新进展
    # Narrow, workspace-authenticated read-only official-source evidence capture.
    # Every redirect is independently SSRF-checked; this never auto-verifies an event.
    official-capture:
      enabled: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_ENABLED:true}
      max-bytes: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_MAX_BYTES:1048576}
      min-text-chars: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_MIN_TEXT_CHARS:200}
      allow-extraction-fallback: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_ALLOW_EXTRACTION_FALLBACK:false}
      timeout-seconds: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_TIMEOUT_SECONDS:15}
      max-redirects: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_MAX_REDIRECTS:5}
      max-attempts: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_MAX_ATTEMPTS:2}
      retry-base-delay-millis: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_RETRY_BASE_DELAY_MILLIS:250}
      retry-max-delay-millis: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_RETRY_MAX_DELAY_MILLIS:5000}
      reuse-ttl-minutes: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_REUSE_TTL_MINUTES:360}
      max-captures-per-minute: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_RATE_PER_MINUTE:30}
      max-concurrent-captures: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_MAX_CONCURRENT:2}
      proxy-url: ${NEWSCLAW_AI_NEWS_OFFICIAL_CAPTURE_PROXY_URL:}
    # Fetch-free main-content extraction. It is disabled for a plain standalone
    # JAR unless the operator supplies an endpoint; Compose enables and requires
    # the pinned Trafilatura adapter.
    content-extraction:
      enabled: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_ENABLED:false}
      required: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_REQUIRED:true}
      endpoint: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_ENDPOINT:http://localhost:8090}
      expected-name: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_EXPECTED_NAME:trafilatura}
      expected-version: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_EXPECTED_VERSION:2.2.0}
      expected-config-hash: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_EXPECTED_CONFIG_HASH:0235b7bf49c3c80ea6a52aee9f413fa2d4e4e1f5196af87278c48e558c7d0400}
      timeout-millis: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_TIMEOUT_MILLIS:5000}
      max-request-bytes: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_MAX_REQUEST_BYTES:1048576}
      max-response-bytes: ${NEWSCLAW_AI_NEWS_CONTENT_EXTRACTION_MAX_RESPONSE_BYTES:1572864}
    # TDT-style bounded online event identity. Exact/strong matches may link
    # automatically; borderline matches remain separate until an operator
    # resolves the durable review proposal. Every version stores this config's
    # effective SHA-256 so threshold changes never rewrite history.
    clustering:
      enabled: ${NEWSCLAW_AI_NEWS_CLUSTERING_ENABLED:true}
      max-candidates: ${NEWSCLAW_AI_NEWS_CLUSTERING_MAX_CANDIDATES:300}
      max-candidate-age-hours: ${NEWSCLAW_AI_NEWS_CLUSTERING_MAX_CANDIDATE_AGE_HOURS:168}
      min-title-blocking-similarity: ${NEWSCLAW_AI_NEWS_CLUSTERING_MIN_TITLE_BLOCKING_SIMILARITY:0.12}
      auto-link-threshold: ${NEWSCLAW_AI_NEWS_CLUSTERING_AUTO_LINK_THRESHOLD:0.80}
      review-threshold: ${NEWSCLAW_AI_NEWS_CLUSTERING_REVIEW_THRESHOLD:0.62}
      min-auto-title-similarity: ${NEWSCLAW_AI_NEWS_CLUSTERING_MIN_AUTO_TITLE_SIMILARITY:0.45}

  # DeepSeek Harness runtime. The executable and Cordis composition are kept
  # outside the Spring classpath and can be supplied by environment variables.
  agent:
    runtime:
        dsh:
          command: ${DSH_JSONRPC_AGENT:}
          cordis-config: ${DSH_CORDIS_CONFIG:}
          working-directory: ${DSH_CWD:}
          base-url: ${DEEPSEEK_BASE_URL:}
          model-name: ${DEEPSEEK_MODEL:}
          api-key: ${DEEPSEEK_API_KEY:}
          manifest-url: ${DSH_MANIFEST_URL:}
          github-release-url: ${DSH_GITHUB_RELEASE_URL:https://api.github.com/repos/deepseek-ai/deepseek-harness/releases/latest}
          install-root: ${DSH_INSTALL_ROOT:${user.home}/.newsclaw/runtimes/deepseek-harness}

    # Deterministic Markdown cleanup of the final answer (heading spaces, glued
    # ---, table pipe alignment) before persistence / channel delivery. Set to
    # false to pass model output through verbatim.
    markdown-normalize-enabled: true
    reasoning:
      # How much of a turn's reasoning reaches the message record.
      #   all      — every iteration's reasoning, kept where it happened. The
      #              reasoning behind each tool call is what a replay needs.
      #   terminal — only the iteration that produced the final answer. Smaller
      #              rows, but a long tool loop persists as a bare conclusion.
      retention: all
    graph:
      observation:
        # 与 GraphObservationProperties.java 默认值对齐，参考 openclaw token-budget 设计
        max-single-observation-chars: 16000
        max-total-observation-chars: 200000
        large-result-threshold: 32000
        min-rounds-for-summarize: 25
        head-ratio: 0.4
        truncation-marker: "\n\n...[TRUNCATED: %d chars total, middle omitted. Do NOT infer or fabricate omitted content; retrieve the full data (e.g. read_file) or tell the user the result is incomplete.]...\n\n"
    tool:
      timeout:
        default-timeout-seconds: 300
        per-category:
          shell: 120
          web: 30
    # Tool-result budget (per-result spill + per-turn aggregate budget).
    # The executor tries to spill the RAW result first so the full output is
    # preserved on disk; the in-context preview points the agent at the spill
    # file via read_file. When spill is disabled, the tool is on the exclusion
    # list, the body is at or below the threshold, or the disk write fails,
    # the executor falls back to inline hard-truncation to the same character
    # cap. Per-turn aggregate caps the combined size across one tool turn.
    tool-result:
      enabled: true
      per-result-threshold-chars: 8000    # aligned with executor hard cap; > this size → spill, ≤ → inline verbatim
      per-turn-budget-chars: 32000        # headroom for multi-tool turns
      preview-head-chars: 800
      excluded-tool-inline-chars: 2500
      storage-base-dir: ""
      # Retrieval-style tools that must NEVER be spilled. Spilling read_file's
      # output causes a recursion: the agent reads the spill path, that read also
      # exceeds the threshold, gets spilled to a new path, agent reads that one,
      # ad infinitum until MAX_TOOL_CALLS_PER_STEP is hit. Add MCP-provided
      # readers here if they have the same role.
      # readSkillFile / load_skill deliberately return the full SKILL.md so the
      # model never misses mandatory sections (API parameter tables etc.);
      # spilling them defeats that and leaves the model an 800-char preview,
      # causing wrong-parameter tool calls. Their references/scripts reads are
      # already self-paginated to 8000 chars, so excluding them stays bounded.
      excluded-tools:
        - read_file
        - read_workspace_memory_file
        - readSkillFile
        - load_skill
      # Spill files are deleted after this many days. Default 0 disables the
      # scheduled sweep entirely so a summary/preview that points at a spill
      # path stays valid for the whole life of the conversation. Files are
      # still purged when the conversation is deleted explicitly via
      # ConversationService.deleteConversation. Raise to a positive value if
      # disk pressure outweighs recoverability for your deployment.
      retention-days: 0
      cleanup-cron: "0 0 3 * * ?"
    conversation:
      window:
        # 测试时临时调低：2000 token ≈ 2000 中文字，3 轮对话即可触发压缩
        # 生产环境应改回 128000
        default-max-input-tokens: 128000
        compact-trigger-ratio: 0.75
        preserve-recent-pairs: 2
        summary-max-tokens: 300
  server:
    # Public base URL used to build absolute download links for tool-generated
    # files (e.g. https://newsclaw.example.com). Leave empty to fall back to the
    # current request's host, and to a relative path when no request is bound.
    # Set this when agents deliver download links to channels/clients that cannot
    # resolve a relative URL (IM messages, copied links, external downloads).
    public-base-url: ${NEWSCLAW_PUBLIC_BASE_URL:}
  openapi:
    # SpringDoc OpenAPI 元信息（驱动 /swagger-ui.html 与 /v3/api-docs）。
    # server-url 留空时由 SpringDoc 从请求 host 推导，避免 Try it out 打到错误地址。
    # 生产若需固定，通过 NEWSCLAW_OPENAPI_SERVER_URL 覆盖（如 https://newsclaw.example.com）。
    title: ${NEWSCLAW_OPENAPI_TITLE:NewsClaw REST API}
    version: ${NEWSCLAW_OPENAPI_VERSION:1.0}
    server-url: ${NEWSCLAW_OPENAPI_SERVER_URL:}
    # description 留空则使用 OpenApiConfig 中的内置默认描述
    description: ${NEWSCLAW_OPENAPI_DESCRIPTION:}
    # 是否公开 Swagger UI / OpenAPI 文档路径（/swagger-ui*、/v3/api-docs*、/webjars/**）。
    # true  = 任何人可浏览（本地开发 / 内网默认）；
    # false = 需要全局管理员（ROLE_ADMIN）才能访问，由 SecurityConfig 强制。
    # 生产数据库 profile（mysql/kingbase/postgres）默认覆盖为 false。
    expose-ui: ${NEWSCLAW_OPENAPI_EXPOSE_UI:true}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
  datasource:
    # Shared AES key for datasource passwords and skill secrets. Keep it in
    # .env so a container restart does not make stored credentials unreadable.
    encrypt-key: ${NEWSCLAW_ENCRYPT_KEY:}
  setting:
    key: ${NEWSCLAW_SETTING_KEY:}
  setup:
    # Desktop/dev may explicitly opt into the first-run splash endpoint.
    allow-anonymous: ${NEWSCLAW_SETUP_ALLOW_ANONYMOUS:true}
  bootstrap:
    password: ${NEWSCLAW_BOOTSTRAP_PASSWORD:}
  sso:
    # 全局开关（默认关闭，不影响现有部署）
    enabled: ${SSO_ENABLED:false}
    # 「仅允许绑定已有账号」模式（false = 允许自动创建新用户）
    link-only: ${SSO_LINK_ONLY:false}
    # 新建 SSO 用户的默认角色
    default-role: ${SSO_DEFAULT_ROLE:user}
    feishu:
      enabled: ${SSO_FEISHU_ENABLED:false}
      app-id: ${SSO_FEISHU_APP_ID:}
      app-secret: ${SSO_FEISHU_APP_SECRET:}
      # 国际版切换: feishu (国内) / lark (国际版 Lark)
      domain: ${SSO_FEISHU_DOMAIN:feishu}
      # SSO 回调地址，通常 https://your-domain/login?sso=callback
      redirect-uri: ${SSO_FEISHU_REDIRECT_URI:}
  # 搜索配置已迁移至数据库（mate_system_setting 表），通过 UI 系统设置管理
  # MCP server 配置已迁移至数据库（mate_mcp_server 表），通过 UI 管理
  mcp:
    enabled: true
  tools:
    screenshot:
      enabled: ${NEWSCLAW_SCREENSHOT_ENABLED:false}
    external-publish:
      enabled: ${NEWSCLAW_EXTERNAL_PUBLISH_ENABLED:false}
    disclosure:
      # progressive: deferred schemas stay behind tool_search/tool_describe and
      #   execute through tool_call in the same action round. enable_tool remains
      #   available only for backwards compatibility with older conversations.
      # legacy: advertise every bound tool up front (pre-disclosure behavior).
      mode: ${NEWSCLAW_TOOLS_DISCLOSURE_MODE:progressive}
  context:
    prefix-budget:
      # Ratio remains useful for small contexts; this hard ceiling is what keeps
      # a provider-declared 1M window from advertising ~30k schema tokens forever.
      tool-schema-max-tokens: ${NEWSCLAW_TOOL_SCHEMA_MAX_TOKENS:12000}
  workspace:
    sandbox:
      # Global fallback filesystem boundary for file/shell tools. When a
      # conversation has no per-workspace base path configured, operations are
      # confined to this root instead of running unconstrained against the whole
      # filesystem (fail-closed default). Set enabled=false to restore the legacy
      # unconstrained behaviour for unconfigured conversations.
      enabled: ${NEWSCLAW_WORKSPACE_SANDBOX_ENABLED:true}
      root: ${NEWSCLAW_WORKSPACE_SANDBOX_ROOT:${user.dir}/data/workspace}
  chat:
    upload:
      # Root directory for conversation chat attachments when neither the active
      # agent nor its workspace configures a base path. Attachments resolve to
      # {baseDir}/{conversationId}/{storedName}. When a workspace/agent base path
      # IS configured, attachments land under {basePath}/chat-uploads/{convId}/
      # instead; reads and cleanup still check this default dir so legacy uploads
      # remain resolvable. Defaults to the legacy location for zero-config parity.
      base-dir: ${NEWSCLAW_CHAT_UPLOAD_BASE_DIR:data/chat-uploads}
      # Organize new attachments/generated media into per-day sub-directories:
      # {convDir}/yyyy-MM-dd/{storedName}. Serving URLs stay flat and reads
      # probe both layouts, so this can be toggled at any time; files written
      # under the previous layout remain resolvable either way. The day is the
      # server's local date (a UTC container groups by UTC days).
      date-folders: ${NEWSCLAW_CHAT_UPLOAD_DATE_FOLDERS:true}
  skill:
    reflection:
      # Out-of-band skill reflection: after a conversation reaches the cadence
      # below, an async reviewer reads the recent window and creates a
      # reviewable diff. It never writes a live Skill on its own.
      # Runs off the request thread, so it never consumes the live turn's
      # context window.
      # Explicit opt-in: transcript/catalog content may be sent to the selected
      # model provider. auto-apply is retained for old deployments but cannot
      # bypass proposal approval in the proposal-first control plane.
      enabled: ${NEWSCLAW_SKILL_REFLECTION_ENABLED:false}
      auto-apply: ${NEWSCLAW_SKILL_REFLECTION_AUTO_APPLY:false}
      # Review once this many new messages have accumulated since the last
      # attempt. 0 disables the cadence gate entirely.
      review-turn-interval: ${NEWSCLAW_SKILL_REFLECTION_TURN_INTERVAL:8}
      # Substance floor — a window with fewer assistant turns than this rarely
      # contains a reusable workflow, so the review is skipped before any LLM
      # call is made.
      min-assistant-turns: ${NEWSCLAW_SKILL_REFLECTION_MIN_ASSISTANT_TURNS:2}
      # Most recent messages handed to the reviewer.
      max-messages: ${NEWSCLAW_SKILL_REFLECTION_MAX_MESSAGES:24}
      # Per-conversation cooldown between reviews, in minutes. Applies on top
      # of the cadence gate, so a busy conversation reviews at most this often.
      cooldown-minutes: ${NEWSCLAW_SKILL_REFLECTION_COOLDOWN_MINUTES:30}
      # Hard cap on create/edit/patch actions applied by a single review.
      max-actions-per-run: ${NEWSCLAW_SKILL_REFLECTION_MAX_ACTIONS:3}
      # Character budget for the existing-skill catalog shown to the reviewer.
      # Skill bodies are truncated to fit; the reviewer is told not to target
      # truncated text with a patch.
      catalog-char-budget: ${NEWSCLAW_SKILL_REFLECTION_CATALOG_BUDGET:8000}
      # Reviewer model id. Empty follows the system default model.
      model-id: ${NEWSCLAW_SKILL_REFLECTION_MODEL_ID:}
    routine:
      # Routine mining: a nightly cross-session pass that clusters the opening
      # request of recent conversations and promotes the ones the user makes
      # habitually into class-level skills. Recurrence is invisible to the
      # per-conversation reflection reviewer above — inside one window a weekly
      # request is indistinguishable from a one-off — so this pass supplies the
      # cross-session evidence that reviewer structurally cannot see.
      # Explicit opt-in because mining persists conversation-derived patterns
      # and promotion sends evidence to the selected model provider.
      enabled: ${NEWSCLAW_SKILL_ROUTINE_ENABLED:false}
      # When true, qualified patterns are synthesized into reviewable proposals
      # only. They still require an admin approval before becoming live Skills.
      auto-promote: ${NEWSCLAW_SKILL_ROUTINE_AUTO_PROMOTE:false}
      cron: ${NEWSCLAW_SKILL_ROUTINE_CRON:0 0 3 * * *}
      # How far back each sweep looks. A routine the user stops doing decays
      # out of this window on its own.
      lookback-days: ${NEWSCLAW_SKILL_ROUTINE_LOOKBACK_DAYS:30}
      # Shingle-similarity above which two openers count as the same request.
      # Tuned toward precision — a false merge invents a routine the user does
      # not have, which is worse than missing one until the next sweep.
      similarity-threshold: ${NEWSCLAW_SKILL_ROUTINE_SIMILARITY:0.62}
      # Promotion gate. Both must hold: occurrences proves repetition, distinct
      # days proves habit rather than one afternoon of retries.
      min-occurrences: ${NEWSCLAW_SKILL_ROUTINE_MIN_OCCURRENCES:3}
      min-distinct-days: ${NEWSCLAW_SKILL_ROUTINE_MIN_DISTINCT_DAYS:3}
      # Shortest opener worth clustering, and the prefix length fed to the
      # shingler.
      min-opener-chars: ${NEWSCLAW_SKILL_ROUTINE_MIN_OPENER_CHARS:8}
      max-opener-chars: ${NEWSCLAW_SKILL_ROUTINE_MAX_OPENER_CHARS:400}
      # Conversation ids retained per candidate as promotion evidence.
      max-samples-per-candidate: ${NEWSCLAW_SKILL_ROUTINE_MAX_SAMPLES:8}
      # Candidates promoted per sweep, bounding LLM cost per run.
      max-promotions-per-run: ${NEWSCLAW_SKILL_ROUTINE_MAX_PROMOTIONS:2}
      # Conversations scanned per sweep, bounding query and memory cost.
      max-conversations-per-run: ${NEWSCLAW_SKILL_ROUTINE_MAX_CONVERSATIONS:1000}
      # Transcript shaping for the synthesis prompt.
      transcript-messages-per-sample: ${NEWSCLAW_SKILL_ROUTINE_TRANSCRIPT_MESSAGES:12}
      transcript-truncate-chars: ${NEWSCLAW_SKILL_ROUTINE_TRANSCRIPT_TRUNCATE:800}
      # Synthesis model id. Empty follows the system default model.
      model-id: ${NEWSCLAW_SKILL_ROUTINE_MODEL_ID:}
    upload:
      # Size caps for skill bundle ZIPs (upload endpoint and marketplace
      # install). The archive is buffered in memory during extraction, so
      # max-total-size-mb also bounds peak heap usage per install. Uploads
      # additionally pass through spring.servlet.multipart limits above.
      max-entry-size-mb: ${NEWSCLAW_SKILL_UPLOAD_MAX_ENTRY_SIZE_MB:1}
      max-total-size-mb: ${NEWSCLAW_SKILL_UPLOAD_MAX_TOTAL_SIZE_MB:50}
    workspace:
      # Skill workspace root. Override with NEWSCLAW_SKILL_WORKSPACE_ROOT to
      # relocate it onto a persistent volume — in Docker this is pointed at
      # /app/data/skills so the existing newsclaw-server-data volume persists installed
      # skills, accumulated LESSONS.md, and skill runtime files across restarts.
      root: ${NEWSCLAW_SKILL_WORKSPACE_ROOT:${user.home}/.newsclaw/skills}
      auto-init: true
      delete-policy: archive
    disclosure:
      load-skill-tool:
        # When false, the load_skill meta tool is not advertised to agents and
        # the skill catalog guidance falls back to readSkillFile. Escape hatch
        # for operators who don't want the explicit skill-load entry point.
        enabled: ${NEWSCLAW_SKILL_LOAD_SKILL_TOOL_ENABLED:true}
    curator:
      enabled: true
      cron: "0 0 2 * * *"         # daily 02:00 — staggered away from wiki / backup jobs
      stale-after-days: 30
      archive-after-days: 90
      # AGENT_CREATED scopes the sweep to skills written autonomously
      # (origin=agent|routine). Skills a user asked for in a conversation are
      # stamped origin=user and are never aged out under this scope.
      scope: AGENT_CREATED         # AGENT_CREATED | ALL_DYNAMIC | OFF
      protect-prefixes:
        - "sys-"
        - "ops-"
      # Restore point captured before every mutating sweep. The sweep archives
      # skills and, with consolidation on, rewrites their bodies — unattended
      # and overnight, so a bad pass is usually noticed long after it ran.
      # Disabling this makes those changes one-way.
      backup-enabled: ${NEWSCLAW_SKILL_CURATOR_BACKUP_ENABLED:true}
      backup-keep: ${NEWSCLAW_SKILL_CURATOR_BACKUP_KEEP:5}
    hub:
      base-url: https://clawhub.ai
      search-path: /api/v1/search
      skills-path: /api/v1/skills
      download-path: /api/v1/download
      http-timeout: 15
      http-retries: 3
  plugin:
    enabled: true
    user-dir: ${user.home}/.newsclaw/plugins
  # RFC-017: 声明式 Hook 系统
  hooks:
    enabled: true
    global-rate-limit: 200       # 全局每秒最大派发数
    global-concurrency: 32       # 同时活跃的派发任务上限
    dispatch-deadline: 5s        # 单事件派发硬预算
    trusted-domains: []          # HttpAction 允许调用的域名（精确或后缀匹配），留空禁用 HTTP
    http:
      connect-timeout: 2s
      read-timeout: 3s
    audit:
      enabled: true              # 每次派发写 mate_hook_run
      retain-days: 7
  security:
    production-mode: ${NEWSCLAW_PRODUCTION_MODE:false}
    # Hosts/IPs/CIDR blocks allowed through the SSRF guards (browser, hooks, image
    # download) even though they are loopback/private/link-local/metadata. Each
    # entry is a literal hostname, a literal IP, or an IPv4 CIDR block. Keep narrow.
    # Example: [192.168.100.100, 192.168.100.0/24, internal.corp]
    ssrf-allowlist: []
  # RFC-014: Anthropic prompt cache 标记
  llm:
    cache:
      enabled: true                # 总开关；false 时全部走 NoOp
      min-prompt-tokens: 1024      # 累计 prompt token 低于此值则跳过缓存（避免 cache write 倒亏）
      max-breakpoints: 4           # 单请求最多打几个 cache_control 断点（Anthropic 上限 4）
      ttl: DEFAULT                 # DEFAULT(5min) | EXTENDED_1H（需要 anthropic-beta header）
      include-tools-block: true    # 工具 schema 段是否独立打断点（CONVERSATION_HISTORY 策略）
      adaptive:
        enabled: true              # 自适应降级（连续 miss 后短路到 NoOp，冷却后恢复）
        miss-threshold: 5
        cool-down-ms: 60000
    # RFC-009 P3.3: per-provider health tracker for the multi-model failover chain.
    # When a provider hits failure-threshold consecutive failures it enters a cooldown
    # window during which the chain walker skips it, avoiding repeated 5-retry stalls
    # against a known-broken provider on every conversation turn.
    failover:
      health:
        enabled: true
        failure-threshold: 3
        cooldown-ms: 300000
  # Multi-agent delegation (DelegateAgentTool).
  delegation:
    # Wall-clock budget for one delegateParallel batch (shared across all
    # children — they run concurrently on virtual threads, so this is total
    # latency, not per-child). 300 s headroom is needed because thinking
    # models (Kimi / GLM / MiniMax) routinely take 90–290 s per LLM turn
    # when the child must produce multi-section structured output.
    parallel-timeout-seconds: 300

  # NewsClaw Agent 配置
  channel:
    # 入站消息去重：IM 平台在 ack 迟到 / 丢失 / 非 200 时会重投同一条消息，
    # 不去重则每次重投都会跑一轮完整 Agent 回合，用户看到重复答复。
    dedup:
      enabled: true
      # 需明显长于各平台重投窗口（秒级到分钟级）
      ttl: 5m
      max-size: 2000
  # Wiki 知识库配置
  wiki:
    enabled: true                       # 是否启用 Wiki 知识库功能
    max-chunk-size: 30000               # LLM 单次处理最大字符数（超过则分块）
    max-context-chars: 10000            # 注入 Agent prompt 的 Wiki 摘要最大字符数
    max-pages-per-raw: 15               # 单个原始材料最多生成的 Wiki 页面数
    max-parallel-phase-b-pages: 3       # RFC-012 follow-up #3：单 chunk 内 phase B 阶段并行处理的 page 数
    auto-process-on-upload: true        # 上传原始材料后是否自动触发 AI 消化
    upload-dir: ./data/wiki-uploads     # 上传文件存储目录
    upload-orphan-ttl-hours: 24         # DB写入前崩溃留下的托管文件清理TTL
    lint-job-ttl-hours: 24               # 内存中的死链扫描 job 保留时间
    max-scan-files: 500                 # 目录扫描最大文件数
    max-scan-file-size: 52428800        # 扫描时跳过大于此大小的文件（字节，默认 50MB）
  # Dream v2 feature flags — production defaults after GA validation
  memory:
    # Phase 1: lifecycle mediator wiring
    lifecycle-mediator-enabled: true
    dream:
      focused-enabled: true
      archive-enabled: true
      archive-keep-days: 30
      max-candidates-per-dream: 100
    # Phase 2: SOUL auto-evolution and provider decorators
    soul-update-interval: 20                   # 20 writes trigger one SOUL.md LLM update (0 = off)
    provider-retry-attempts: 1                 # 1 = no retry (enable when external providers added)
    provider-metrics-enabled: false            # actuator dependency now present; enable when external providers added
    # Phase 3: fact projection
    fact:
      projection-enabled: true
      projection-rebuild-cron: "0 */30 * * * ?"
      llm-extraction-enabled: false            # placeholder impl, enable after Phase 3 L4+
      contradiction-check-enabled: false       # experimental simple detection, enable after LLM batch impl
      trust-half-life-days: 60
      forget-enabled: true
    # Always-on injection budget — bounds the per-turn size of the user/feedback structured block
    system-block-max-chars: 4000               # char cap on the always-on block; over budget drops oldest by Updated date (LRU); 0 = unlimited
    system-block-max-entries-per-type: 40       # max entries injected per type (user/feedback); 0 = unlimited
    # Structured-memory consolidation — separate maintenance task; LLM merges duplicate/stale user/feedback entries (shared + per-owner) to curb storage growth
    structured-consolidation-enabled: true            # off = injection cap only, no storage-side merge
    structured-consolidation-min-entries: 8            # buckets with fewer entries skip the LLM call to save cost
    structured-consolidation-cron: "0 30 3 * * ?"     # own schedule, decoupled from dreaming-enabled / dreaming-cron
    structured-consolidation-max-owners-per-run: 50    # cap LLM cost per agent per run; remaining owners picked up next run; 0 = unlimited
    # Always-on file ceilings — deterministic backstop so PROFILE.md / MEMORY.md (LLM-rewritten) cannot grow per-turn context without bound
    profile-max-chars: 4000                            # PROFILE.md hard cap; truncates at a section boundary if the rewrite overruns; 0 = unlimited
    memory-md-max-chars: 8000                          # MEMORY.md hard cap; 0 = unlimited
    owner-block-max-chars: 12000                       # total per-owner builtin memory injected per turn
    owner-daily-max-files: 7                           # only newest daily ledgers stay always-on
    # Long-term memory admission: records a versioned ledger before each
    # durable write, requires a source pointer, bounds token growth, and keeps
    # AI-news article/evidence bodies in the event/Wiki evidence domain.
    governance-enabled: ${NEWSCLAW_MEMORY_GOVERNANCE_ENABLED:true}
    write-max-tokens: ${NEWSCLAW_MEMORY_WRITE_MAX_TOKENS:320}
    long-term-token-budget: ${NEWSCLAW_MEMORY_LONG_TERM_TOKEN_BUDGET:2400}
    reject-news-body: ${NEWSCLAW_MEMORY_REJECT_NEWS_BODY:true}
    require-source-ref: ${NEWSCLAW_MEMORY_REQUIRE_SOURCE_REF:true}
    governance-pending-ttl-minutes: ${NEWSCLAW_MEMORY_GOVERNANCE_PENDING_TTL_MINUTES:30}
