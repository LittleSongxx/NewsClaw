name: mateclaw
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - pypdf==6.0.0
      - pdfplumber==0.11.7
      - feedparser==6.0.11

# The deai_humanize trace scorer itself uses only Python's standard library.
# The three packages above cover PDF/RSS ingestion used by the AI-news radar
# skills and keep a reproducible local environment for future connectors.
